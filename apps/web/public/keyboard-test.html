<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Keyboard test</title>
    <style>
      body { font: 18px system-ui, sans-serif; padding: 2rem 1rem; background: #1f4f8c; color: #fff; }
      input, textarea { width: 100%; font-size: 18px; padding: 14px; margin: 8px 0 20px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>Keyboard test</h1>
    <p>A bare page: no app code, no styling tricks. Tap a field. Does the keyboard open?</p>
    <label>Text<input type="text" placeholder="type here" /></label>
    <label>Email<input type="email" placeholder="email" /></label>
    <label>Password<input type="password" placeholder="password" /></label>
    <label>Message<textarea rows="3" placeholder="message"></textarea></label>
  </body>
</html>
