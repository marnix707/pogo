<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1f4f8c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Home-screen install: opens fullscreen (no browser bars) when launched from the icon -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Po:go" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Po:go</title>
    <script>
      // Apply the saved look (the CRT layer, on by default) before first paint.
      try {
        var s = JSON.parse(localStorage.getItem('pogo.settings') || '{}');
        document.documentElement.classList.toggle('crt', s.crt !== false);
      } catch (e) {
        document.documentElement.classList.add('crt');
      }
    </script>
  </head>
  <body>
    <div class="safe-top-scrim" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
