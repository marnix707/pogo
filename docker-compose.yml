name: pogo

x-dev-build: &dev-build
  context: .
  dockerfile: Dockerfile.dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pogo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pogo}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: *dev-build
    command: ['sh', '/app/docker/server-dev.sh']
    working_dir: /app/apps/server
    environment:
      NODE_ENV: development
      SERVER_PORT: ${SERVER_PORT:-3000}
      WEB_PORT: ${WEB_PORT:-5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pogo:pogo_dev_password@db:5432/pogo?schema=public}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:-postgresql://pogo:pogo_dev_password@db:5432/pogo?schema=public}}
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is missing - run make env to create .env}'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # The emailed-code mailbox endpoint (GET /api/dev/last-mail) exists only when this is 1 (local e2e); `make up-lan` turns it off.
      DEV_MAILBOX: ${DEV_MAILBOX:-1}
      # How many proxies sit in front (production only; see render.yaml). Unset = trust X-Forwarded-For fully.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST_LAN_IPS: ${HOST_LAN_IPS:-}
      DISCONNECT_GRACE_SEC: ${DISCONNECT_GRACE_SEC:-20}
      ROOM_TTL_SEC: ${ROOM_TTL_SEC:-600}
      # Generous in dev so repeated e2e runs don't trip it; production default is 10.
      GUEST_SIGNUP_LIMIT_PER_MIN: ${GUEST_SIGNUP_LIMIT_PER_MIN:-100}
      PROFANITY_FILTER: ${PROFANITY_FILTER:-on}
      # How long the computer "thinks" per move (ms); quick in dev, 1000 by default elsewhere.
      BOT_DELAY_MS: ${BOT_DELAY_MS:-700}
      # Emailed codes: `log` prints them in the server log (dev); `smtp` needs SMTP_HOST/PORT/USER/PASSWORD.
      MAIL_MODE: ${MAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_URL: ${SMTP_URL:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Emails that become admin (admin panel) when they register or log in.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEV_EMAILS: ${DEV_EMAILS:-}
      MAIL_FROM: ${MAIL_FROM:-POGO <no-reply@pogo.local>}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      # Local only by default (`make up`); `make up-lan` binds all interfaces for phone testing.
      - '${BIND_ADDR:-127.0.0.1}:${HOST_SERVER_PORT:-${SERVER_PORT:-3000}}:3000'
    volumes:
      - .:/app
      # Keep node_modules inside the container; never share with the host.
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build: *dev-build
    command: ['pnpm', '--filter', '@pogo/web', 'dev']
    working_dir: /app/apps/web
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://server:3000}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${HOST_WEB_PORT:-${WEB_PORT:-5173}}:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5173/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # End-to-end tests (Playwright + Chromium): `make e2e` or `docker compose --profile e2e run --rm e2e`
  e2e:
    profiles: ['e2e']
    build: ./e2e
    environment:
      BASE_URL: http://web:5173
      # So the tests know whether chat/nicknames are being filtered.
      PROFANITY_FILTER: ${PROFANITY_FILTER:-on}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEV_EMAILS: ${DEV_EMAILS:-}
    volumes:
      - ./e2e/tests:/e2e/tests
      - ./e2e/playwright.config.ts:/e2e/playwright.config.ts
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
