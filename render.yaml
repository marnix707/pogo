# Render Blueprint for Pogo: one free web service in Frankfurt, database on Neon (also Frankfurt).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pogo
    runtime: docker
    plan: free
    region: frankfurt # cannot be changed after the service is created

    # Multi-stage image: builds the web app, bundles the server, runs migrations on start.
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Cheap liveness check that does NOT touch the database, so Render's frequent probes
    # never wake Neon's auto-suspended compute.
    healthCheckPath: /api/livez

    autoDeployTrigger: commit # redeploy on every push to the default branch

    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: '10000' # Render's default port for web services
      - key: LOG_LEVEL
        value: info

      # Secret: Render prompts for this when you first create the Blueprint; it is never in git.
      # Paste your Neon connection string (with ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Optional secret: Neon's *direct* (non-pooled) string, used for migrations only.
      # If left empty the server falls back to DATABASE_URL.
      - key: DIRECT_URL
        sync: false

      # Random 256-bit value generated once by Render; signs guest/user tokens.
      - key: JWT_SECRET
        generateValue: true

      # Profanity filter for chat and guest nicknames: 'on' or 'off'. Can be flipped in the Render
      # dashboard (Environment) without a code change.
      - key: PROFANITY_FILTER
        value: 'off'

      # How long computer players "think" before each move (ms)
      - key: BOT_DELAY_MS
        value: '1000'

      # Emailed codes for registering. Render's free tier blocks SMTP, so production sends through
      # Brevo's HTTPS API (BREVO_API_KEY below). 'log' would only print the codes in the server log:
      # a Blueprint sync writes the values in this file over the dashboard, so keep this one 'brevo'.
      - key: MAIL_MODE
        value: brevo
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Render's free tier blocks outgoing SMTP: use MAIL_MODE=brevo with the API key from Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # The verified Brevo sender, e.g. POGO <pogo@maruha.nl> (set in the dashboard; not overwritten by syncs).
      - key: MAIL_FROM
        sync: false

      # Admin panel: these emails become admin when they register or log in (comma separated).
      - key: ADMIN_EMAILS
        sync: false
      - key: DEV_EMAILS
        sync: false

      # Gameplay timings (same defaults as .env.example)
      - key: TURN_TIME_SEC
        value: '30'
      - key: DISCONNECT_GRACE_SEC
        value: '20'
      - key: ROOM_TTL_SEC
        value: '600'
